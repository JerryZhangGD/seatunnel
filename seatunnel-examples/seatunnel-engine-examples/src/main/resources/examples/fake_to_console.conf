env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Http {
    result_table_name = "http"
    url = "http://10.30.30.88:13005/app/datadev/publish-center/approve-page"
    method = "POST"
    format = "json"
    headers = {content-type="application/json;charset=UTF-8",loginToken="eyJhbGciOiJSUzI1NiJ9..kPFXntXmYXjnosm2mkOHSEEHNSV_u6nrcfu4ydiSpx7OTWK36Nv-5U2K3193Zk63PZ3XqlObxK9TjcFxtYTCBg"}
    schema = {
      fields = {
        taskFlowId = bigint
        taskFlowName = string
        taskFlowType = string
        total = int
        code = bigint
        list = string
      }
    }

    json_field = {
      taskFlowId = "$.data.list[*].taskFlowId"
      taskFlowName = "$.data.list[*].taskFlowName"
      taskFlowType = "$.data.list[*].taskFlowType"
      total = "$.data.total"
      code = "$.code"
      list = "$.data.list"
    }


  }
}

# Console printing of the read Http data
sink {
  Console {
    parallelism = 1
  }
}